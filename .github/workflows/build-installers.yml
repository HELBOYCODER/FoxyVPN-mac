name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package installer
        run: gradle packageDistributionForCurrentOS --no-daemon

      - name: Upload installers to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main/dmg/*.dmg
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
